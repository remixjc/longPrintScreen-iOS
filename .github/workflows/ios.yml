name: iOS validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install generator
        run: brew install xcodegen
      - name: Core algorithm tests
        run: swift test --scratch-path /tmp/longshot-core
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS app and extensions
        run: |
          xcodebuild -project LongShot.xcodeproj -scheme LongShot \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/longshot-ci \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run iOS integration and UI tests
        timeout-minutes: 20
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project LongShot.xcodeproj -scheme LongShot \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -derivedDataPath /tmp/longshot-tests \
            -resultBundlePath /tmp/LongShot-CI.xcresult \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d /tmp/LongShot-CI.xcresult ]; then
            xcrun xcresulttool export attachments --path /tmp/LongShot-CI.xcresult --output-path /tmp/LongShot-Screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: /tmp/LongShot-CI.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-screenshots
          path: |
            /tmp/LongShot-Screenshots/*.png
            /tmp/LongShot-Screenshots/*.jpg
            /tmp/LongShot-Screenshots/*.jpeg
            /tmp/LongShot-Screenshots/manifest.json
