name: LongShot
options:
  bundleIdPrefix: com.remixjc.longPrintScreen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: M898TXZKKP
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  StitchCore:
    path: .
targets:
  LongShot:
    type: application
    platform: iOS
    sources:
      - LongShot
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remixjc.longPrintScreen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: LongShot/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LongShot/Resources/LongShot.entitlements
    dependencies:
      - package: StitchCore
      - target: ShareExtension
      - target: BroadcastExtension
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remixjc.longPrintScreen.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Share.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: StitchCore
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - BroadcastExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remixjc.longPrintScreen.broadcast
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/Broadcast.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: StitchCore
  LongShotTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/AppTests
    dependencies:
      - target: LongShot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LongShotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/UITests
    dependencies:
      - target: LongShot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LongShot:
    build:
      targets:
        LongShot: all
    run:
      config: Debug
      storeKitConfiguration: LongShot/Resources/Products.storekit
    test:
      config: Debug
      targets:
        - LongShotTests
        - LongShotUITests
      storeKitConfiguration: LongShot/Resources/Products.storekit
    archive:
      config: Release
